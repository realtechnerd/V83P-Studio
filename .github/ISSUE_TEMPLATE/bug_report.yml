name: Bug report
description: Something in the app doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Problems while installing or restoring firmware have their own form: **Firmware problem**.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Went to Music and turned it on
        2. Played a song in Spotify
        3. The keyboard stayed on my normal lighting
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Where in the app?
      options: [Lighting, Keys, Macros, Knob, Music, Reactions, Profiles, Device / firmware, Tray menu, Installer, Other]
    validations:
      required: true
  - type: dropdown
    id: colorway
    attributes:
      label: Keyboard colorway
      options: [Matcha, Mint]
    validations:
      required: true
  - type: dropdown
    id: firmware
    attributes:
      label: Keyboard firmware
      description: Shown at the bottom left of the app, and on the Device page.
      options:
        - V83P Studio firmware (release 0220 or newer)
        - Original / stock firmware (release 0108)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How was the keyboard connected?
      options: [Cable (switch on wired), 2.4G dongle, Bluetooth, Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: V83P Studio version
      description: From the installer's file name or Settings → Apps.
      placeholder: "0.9.0"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Paste the end of `%APPDATA%\V83P Studio\backend.log` (paste that path into File Explorer's address bar),
        or drag the file here. File paths in it may show your Windows user name: remove anything you'd rather not share.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
