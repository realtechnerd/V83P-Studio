# Builds the Windows installer on GitHub's runners (dist/installer/V83P-Studio-Setup-<version>.exe).
# Every run uploads it as a build artifact; a v* tag also attaches it to that tag's GitHub Release.
# Only tracked files are used: no personal data (config/, profiles/, backup/) and no QMK (the firmware .bin is prebuilt).
name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./electron/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match electron/package.json version $version"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build backend + installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned for now (signing comes later via SignPath)
        run: npm run dist -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: V83P-Studio-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: V83P-Studio-Setup-${{ needs.build.outputs.version }}
          path: installer

      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --prerelease --title "V83P Studio $TAG" --generate-notes
          fi
          gh release upload "$TAG" installer/*.exe --clobber
